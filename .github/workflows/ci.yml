name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Needs no connection: every partner file must load and pass the cross-checks.
      - name: Validate partner configurations
        run: uv run factory validate

      - name: Tests
        run: uv run pytest

  # The DAGs are generated from the partner files. This only proves they import and have the
  # expected shape; a full run needs Snowflake and is done on the local Airflow (see README).
  dags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: DAG import test
        run: >
          uv run --no-project --with apache-airflow==3.4.0 --with pytest
          pytest --rootdir airflow airflow/tests
