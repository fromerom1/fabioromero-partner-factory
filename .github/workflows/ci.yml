name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install
        run: uv sync --extra dev --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # Needs no connection: every partner file must load and pass the cross-checks.
      - name: Validate partner configurations
        run: uv run factory validate

      - name: Tests
        run: uv run pytest
