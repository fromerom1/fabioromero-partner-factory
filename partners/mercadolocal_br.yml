partner_code: MERCADOLOCAL_BR
display_name: MercadoLocal (Brazil)
country_code: BR
currency_code: BRL
timezone: America/Sao_Paulo

sources:
  stores:
    description: Store list. Additive, new stores appear and existing ones remain.
    format: csv
    file_pattern: "(.*/)?stores_[0-9]{8}[^/]*[.]csv"
    example_file: stores_20261001.csv
    batch_date: {regex: "stores_([0-9]{8})", format: YYYYMMDD}
    csv:
      columns: [store_group, store_token, store_name]

  sales:
    description: Sales transactions. One or more files per batch date.
    format: csv
    file_pattern: "(.*/)?sales_[0-9]{8}[^/]*[.]csv"
    example_file: sales_20261001.csv
    batch_date: {regex: "sales_([0-9]{8})", format: YYYYMMDD}
    csv:
      # The data dictionary lists six columns; the sample record carries a seventh, source_id,
      # between amount and user_role. The file order below follows the sample.
      columns:
        - store_token
        - transaction_id
        - receipt_token
        - transaction_time
        - amount
        - source_id
        - user_role

standard_model:
  store:
    source: stores
    fields:
      store_id:
        from: store_token
        transforms: [lower]
        matches: "[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}"
      store_name: {from: store_name}
      # The partner does not say whether a store is active: is_active stays unknown.

  sales_transaction:
    source: sales
    # A transaction is unique per store, not across the partner.
    key: [store_id, transaction_id]
    fields:
      transaction_id:
        from: transaction_id
        transforms: [lower]
        matches: "[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}"
      store_id:
        from: store_token
        transforms: [lower]
        matches: "[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}"
      transaction_ts: {from: transaction_time, format: 'YYYYMMDD"T"HH24MISS.FF3'}
      amount:
        from: amount
        transforms: [strip_currency_symbol, remove_thousands_separator]
      # Every record is a completed sale: the partner sends no status.
      status: {constant: COMPLETED}
